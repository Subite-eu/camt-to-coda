name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }} / conversion and build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ matrix.node }}', cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm ci
      - run: npm run examples:check
      - run: npm run typecheck
      - run: npm run build
      - run: npm run build:web
      - run: npm run test:coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: 'coverage-node-${{ matrix.node }}', path: coverage/ }

  browser:
    name: Browser / ${{ matrix.browser }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit, mobile-chrome]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: sudo apt-get update && sudo apt-get install -y libxml2-utils
      - run: npm ci
      - name: Install browser and system dependencies
        env: { BROWSER: '${{ matrix.browser }}' }
        run: npx playwright install --with-deps "${BROWSER/mobile-chrome/chromium}"
      - run: npm run build:web
      - run: npm run test:e2e -- --project=${{ matrix.browser }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/

  security:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=moderate

  storage:
    name: MinIO / live storage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: npm }
      - run: npm ci
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: scripts/Dockerfile.minio-test
          load: true
          tags: minio:test
          cache-from: type=gha,scope=minio
          cache-to: type=gha,scope=minio,mode=max
      - name: Start isolated MinIO service
        run: |
          docker run --detach --name minio -p 9000:9000 -e MINIO_ROOT_USER=minioadmin -e MINIO_ROOT_PASSWORD=minioadmin minio:test server /data
          curl --fail --retry 20 --retry-connrefused --retry-all-errors --retry-delay 1 --max-time 2 http://localhost:9000/minio/health/live
      - run: npx vitest run --project node test/unit/storage.test.ts
        env: { MINIO_ENDPOINT: 'http://localhost:9000' }
      - if: always()
        run: docker logs minio && docker rm -f minio

  docker:
    name: Docker / CLI and web smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: camt2coda:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - run: docker run --rm camt2coda:ci --version
      - name: Verify bundled web application and server
        run: |
          docker run --detach --name camt2coda-smoke -p 3000:3000 camt2coda:ci serve --host 0.0.0.0
          trap 'docker logs camt2coda-smoke; docker rm -f camt2coda-smoke' EXIT
          curl --fail --retry 15 --retry-connrefused --retry-all-errors --retry-delay 1 --max-time 2 http://localhost:3000/api/health
          curl --fail http://localhost:3000/ | tee /tmp/camt2coda-index.html
          asset=$(sed -n 's/.*src="\([^"]*\/assets\/[^" ]*\.js\)".*/\1/p' /tmp/camt2coda-index.html | head -1)
          test -n "$asset"
          curl --fail "http://localhost:3000$asset" --output /dev/null

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [test, browser, security, storage, docker]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        env: { REPO: '${{ github.repository }}' }
        run: echo "name=${REPO,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ghcr.io/${{ steps.image.outputs.name }}:main
